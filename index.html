    <!--
      Page background before the app's CSS loads. Without it the edge
      bridge's text summary (and the moment between it and the app's first
      paint) shows as a white page, then flips to the dark app. Same colors
      as the default dark / light themes (mainTheme, CLEAN); the theme cookie
      (light | dark | system) picks the scheme like HookProvider does. The
      MUI baseline styles take over once the app renders.

      data-cfasync="false" on every script here (and on the built entry tag,
      see cfasyncPlugin in vite.config.ts): Cloudflare Rocket Loader, if it is
      ever switched on again, rewrites script types and replays them late from
      its own loader, so this guard and the pre-theme ran after the app.
    -->
    <script data-cfasync="false">
      ;(function () {
        try {
          var m = document.cookie.match(/(?:^|; )theme=([^;]*)/)
          var v = m ? decodeURIComponent(m[1]) : "system"
          var light =
            v === "light" ||
            (v === "system" &&
              window.matchMedia("(prefers-color-scheme: light)").matches)
          document.documentElement.setAttribute(
            "data-pre-theme",
            light ? "light" : "dark",
          )
        } catch (e) {}
      })()
    </script>
    <style>
      html[data-pre-theme="dark"] {
        background-color: #0b0f1a;
        color: #b7b7b7;
        color-scheme: dark;
      }
      html[data-pre-theme="light"] {
        background-color: #ffffff;
        color: #1a1a1a;
      }
      html[data-pre-theme="dark"] a {
        color: #10b881;
      }
    </style>

    <!-- Font optimization: Use system fonts with font-display swap -->
    <style>
      /* Prevent FOIT (Flash of Invisible Text) */
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }

      /* Load Inter font with swap to prevent layout shift */
      @supports (font-variation-settings: normal) {
        body {
          font-family:
            "Inter var",
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Helvetica,
            Arial,
            sans-serif;
        }
      }
    </style>

    <!-- Preconnect to font CDN if using external fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <script data-cfasync="false">
      // Keep in sync with src/util/assetReloadGuard.ts (same keys / limits).
      ;(function () {
        var ATTEMPTS_KEY = "scmarket_asset_reload_attempts"
        var WINDOW_START_KEY = "scmarket_asset_reload_window_start"
        var MAX_ATTEMPTS = 2
        var WINDOW_MS = 120000

        function tryEmergencyReload() {
          try {
            var now = Date.now()
            var windowStart = parseInt(sessionStorage.getItem(WINDOW_START_KEY) || "0", 10)
            var n = parseInt(sessionStorage.getItem(ATTEMPTS_KEY) || "0", 10)
            if (!windowStart || now - windowStart > WINDOW_MS) {
              windowStart = now
              n = 0
              sessionStorage.setItem(WINDOW_START_KEY, String(windowStart))
              sessionStorage.setItem(ATTEMPTS_KEY, "0")
            }
            if (n >= MAX_ATTEMPTS) return
            sessionStorage.setItem(ATTEMPTS_KEY, String(n + 1))
            window.location.reload()
          } catch (e) {}
        }

        // NOTE: we deliberately do NOT handle vite:preloadError here. That event
        // is left unhandled on purpose (see src/index.tsx) so failed route
        // imports reject into retryDynamicImport: they are retried in place first, and
        // only escalated to a reload once retries are exhausted. Reloading here
        // on the FIRST failed attempt would preempt that retry — and would also
        // reload on hover-prefetch failures, which must stay silent.
        //
        // This capture-phase listener stays for the one case the module layer
        // cannot cover: a top-level script/asset tag (e.g. the entry bundle
        // itself) that fails to load before src/index.tsx ever runs.
        window.addEventListener(
          "error",
          function (event) {
            if (event.target && event.target.tagName === "SCRIPT") {
              var src = (event.target.src || event.target.getAttribute("src") || "").toString()
              var isOurAsset =
                src.indexOf("/assets/") !== -1 ||
                (src.indexOf(window.location.origin) === 0 && /\.(js|mjs)$/.test(src))
              if (isOurAsset) tryEmergencyReload()
            }
          },
          true
        )
      })()
    </script>
