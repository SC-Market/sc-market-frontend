<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#111828" />
    <!-- Samsung Internet specific meta tags for PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="keywords" content="Gaming, Star Citizen, Market" />

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://sc-market.space/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SC Market" />
    <meta
      property="og:image"
      content="https://sc-market.space/homepage-preview.webp"
    />
    <meta
      name="description"
      property="og:description"
      content="Welcome to Star Citizen Market! This platform aims to facilitate the exchange of goods and services between Star Citizen players, all in aUEC. Buy, sell, and trade your in game items or contract orgs to perform services you need, such as requesting medical assistance, salvaging ships, transporting cargo, and escorting missions."
    />
    <!--    <meta property='og:image:width' content='3396'/>-->
    <!--    <meta property='og:image:height' content='1876'/>-->

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="sc-market.space" />
    <meta property="twitter:url" content="https://sc-market.space/" />
    <meta name="twitter:title" content="SC Market" />
    <meta
      name="twitter:description"
      content="Welcome to Star Citizen Market! This platform aims to facilitate the exchange of goods and services between Star Citizen players, all in aUEC. Buy, sell, and trade your in game items or contract orgs to perform services you need, such as requesting medical assistance, salvaging ships, transporting cargo, and escorting missions."
    />
    <meta
      name="twitter:image"
      content="https://sc-market.space/homepage-preview.webp"
    />

    <!-- Web app manifest (static file in public/, see public/manifest.webmanifest). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SC Market</title>

    <!--
      Preload the theme's text font (Electrolize, self-hosted; src/fonts.css)
      so it is usually in before the app's first render. Roboto is only a
      fallback in the theme's font stack and is no longer preloaded.
    -->
    <link
      rel="preload"
      href="/fonts/electrolize-v20-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Resource hints for third-party domains -->
    <link rel="dns-prefetch" href="https://sc-market.space" />
    <link rel="dns-prefetch" href="https://sessions.bugsnag.com" />
    <link rel="preconnect" href="https://sc-market.space" crossorigin />
    <!-- The app's first requests (session check, profile, listings) go here. -->
    <link rel="preconnect" href="https://api.sc-market.space" crossorigin />

    <!--
      Page background before the app's CSS loads. Without it the edge
      bridge's text summary (and the moment between it and the app's first
      paint) shows as a white page, then flips to the dark app. Same colors
      as the default dark / light themes (mainTheme, CLEAN); the theme cookie
      (light | dark | system) picks the scheme like HookProvider does. The
      MUI baseline styles take over once the app renders.

      data-cfasync="false" on every script here (and on React Router's
      scripts, see src/root.tsx and src/document/cfasync.ts): Cloudflare
      Rocket Loader, if it is ever switched on again, rewrites script types
      and replays them late from its own loader, so this guard and the
      pre-theme ran after the app.
    -->
    <script data-cfasync="false">
      ;(function () {
        try {
          var m = document.cookie.match(/(?:^|; )theme=([^;]*)/)
          var v = m ? decodeURIComponent(m[1]) : "system"
          var light =
            v === "light" ||
            (v === "system" &&
              window.matchMedia("(prefers-color-scheme: light)").matches)
          document.documentElement.setAttribute(
            "data-pre-theme",
            light ? "light" : "dark",
          )
          // The cookie bar is in a prerendered page's HTML; hide it if the
          // visitor already chose (src/components/alert/CookieConsent.tsx).
          if (/(?:^|; )cookie_consent=/.test(document.cookie)) {
            document.documentElement.setAttribute("data-consent-set", "")
          }
          // A prerendered page (src/prerender/paths.ts) is the main site's,
          // in English, dark. Where the app will show something else (an
          // org's white-label domain, another language, the light theme),
          // entry.client renders it
          // from scratch instead of hydrating, and it stays hidden until then
          // rather than showing the wrong branding or language first. Keep in
          // sync with src/util/mainSiteHost.ts and i18next's detection order
          // (?lng, i18next cookie, localStorage, browser) in util/i18n.ts.
          var h = location.hostname
          var mainSite =
            h === "localhost" ||
            h === "sc-market.space" ||
            h === "www.sc-market.space" ||
            /\.localhost$/.test(h) ||
            /\.sc-market-frontend\.pages\.dev$/.test(h)
          var c = document.cookie.match(/(?:^|; )i18next=([^;]*)/)
          var lng =
            new URLSearchParams(location.search).get("lng") ||
            (c && decodeURIComponent(c[1])) ||
            localStorage.getItem("i18nextLng") ||
            navigator.language ||
            "en"
          // ...and in the light theme: prerendered pages are dark (the
          // default), and the app's theme isn't CSS variables yet.
          if (!mainSite || light || /^(de|es|fr|ja|uk|zh)\b/i.test(lng)) {
            document.documentElement.setAttribute("data-render-fresh", "")
          }
        } catch (e) {}
      })()
    </script>
    <style>
      html[data-pre-theme="dark"] {
        background-color: #0b0f1a;
        color: #b7b7b7;
        color-scheme: dark;
      }
      html[data-pre-theme="light"] {
        background-color: #ffffff;
        color: #1a1a1a;
      }
      html[data-pre-theme="dark"] a {
        color: #10b881;
      }
      html[data-consent-set] [data-cookie-consent-bar] {
        display: none;
      }
      html[data-render-fresh] #root[data-prerendered] {
        visibility: hidden;
      }
    </style>

    <!-- Font optimization: Use system fonts with font-display swap -->
    <style>
      /* Prevent FOIT (Flash of Invisible Text) */
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }

      /* Load Inter font with swap to prevent layout shift */
      @supports (font-variation-settings: normal) {
        body {
          font-family:
            "Inter var",
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Helvetica,
            Arial,
            sans-serif;
        }
      }
    </style>

    <script data-cfasync="false">
      // Keep in sync with src/util/assetReloadGuard.ts (same keys / limits).
      ;(function () {
        var ATTEMPTS_KEY = "scmarket_asset_reload_attempts"
        var WINDOW_START_KEY = "scmarket_asset_reload_window_start"
        var MAX_ATTEMPTS = 2
        var WINDOW_MS = 120000

        function tryEmergencyReload() {
          try {
            var now = Date.now()
            var windowStart = parseInt(
              sessionStorage.getItem(WINDOW_START_KEY) || "0",
              10,
            )
            var n = parseInt(sessionStorage.getItem(ATTEMPTS_KEY) || "0", 10)
            if (!windowStart || now - windowStart > WINDOW_MS) {
              windowStart = now
              n = 0
              sessionStorage.setItem(WINDOW_START_KEY, String(windowStart))
              sessionStorage.setItem(ATTEMPTS_KEY, "0")
            }
            if (n >= MAX_ATTEMPTS) return
            sessionStorage.setItem(ATTEMPTS_KEY, String(n + 1))
            window.location.reload()
          } catch (e) {}
        }

        // NOTE: we deliberately do NOT handle vite:preloadError here. That event
        // is left unhandled on purpose (see src/entry.client.tsx) so failed route
        // imports reject into retryDynamicImport: they are retried in place first, and
        // only escalated to a reload once retries are exhausted. Reloading here
        // on the FIRST failed attempt would preempt that retry — and would also
        // reload on hover-prefetch failures, which must stay silent.
        //
        // These listeners stay for the one case the module layer cannot
        // cover: the app's own bootstrap failing before src/entry.client.tsx
        // ever runs. React Router starts the app from an inline module script
        // (<Scripts /> in src/root.tsx) that statically imports its route
        // manifest and the root route chunk, then import()s the entry chunk:
        // - a failed static import fires "error" on that inline script (no
        //   src), and a failed external script fires it on its tag;
        // - a failed import() of the entry chunk is an unhandled rejection.
        //   Only until the entry has run (window.__scmEntryStarted): after
        //   that the app's own retry/reload logic owns chunk failures.
        window.addEventListener(
          "error",
          function (event) {
            var el = event.target
            if (el && el.tagName === "SCRIPT") {
              var src = (el.src || el.getAttribute("src") || "").toString()
              var isOurAsset =
                src.indexOf("/assets/") !== -1 ||
                (src.indexOf(window.location.origin) === 0 &&
                  /\.(js|mjs)$/.test(src)) ||
                (!src && el.type === "module")
              if (isOurAsset) tryEmergencyReload()
            }
          },
          true,
        )
        window.addEventListener("unhandledrejection", function (event) {
          if (window.__scmEntryStarted) return
          var reason = event.reason
          var text =
            reason && reason.message ? String(reason.message) : String(reason)
          if (
            /dynamically imported module|Importing a module script failed/i.test(
              text,
            ) &&
            text.indexOf("/assets/") !== -1
          ) {
            tryEmergencyReload()
          }
        })
      })()
    </script>
    <!--app-head-->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><!--app-html--></div>
  </body>
</html>
