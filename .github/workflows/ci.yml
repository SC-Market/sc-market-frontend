# Type-check, test and build every push and PR. Informational only: Cloudflare
# Pages deploys independently and does not wait on this check, but a failure
# shows on the commit and GitHub notifies whoever pushed.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check app
        run: npm run check

      - name: Type-check Pages Functions
        run: npx tsc --noEmit -p functions

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
