# Type-check, test and build every push and PR. Informational only: Cloudflare
# Pages deploys independently and does not wait on this check, but a failure
# shows on the commit and GitHub notifies whoever pushed.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check app
        run: npm run check

      - name: Type-check Pages Functions
        run: npx tsc --noEmit -p functions

      - name: Run tests
        run: npm test

      - name: Locale catalogs complete
        # Every locale has every en key, with its own plural forms and the
        # same {{placeholders}} / tags (scripts/check-i18n.mjs).
        run: npm run i18n:check

      - name: Build production bundle
        # Also checks the built shell and that sw.js stays push-only
        # (scripts/build/finalize.ts).
        run: npm run build

      - name: Service worker stays push-only
        # No precache, routing or fetch handler, ever: an asset-caching SW
        # caused deploy crash loops (see src/sw.ts).
        run: |
          if grep -nE "precacheAndRoute\(|registerRoute\(|__WB_MANIFEST|addEventListener\([\"'\`]fetch|onfetch\s*=" src/sw.ts dist/sw.js; then
            echo "::error::sw.js must not precache or handle fetches"
            exit 1
          fi

  e2e:
    # Read-only Playwright smoke flows + the accessible-name audit, against a
    # local production build with the API faked inside the test process
    # (e2e/support/fakeApi.ts; nothing reaches production). Informational,
    # like the job above. See docs/testing-with-mcp.md.
    name: E2E smoke + a11y names
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Type-check e2e
        run: npx tsc --noEmit -p e2e

      - name: Build e2e bundle
        run: npm run e2e:build

      - name: Smoke flows
        run: npx playwright test --project=smoke

      - name: Accessible-name audit
        if: ${{ !cancelled() }}
        run: npx playwright test --project=a11y

      - name: Audit summary
        if: ${{ !cancelled() }}
        run: npx tsx e2e/a11y/report.ts

      - name: Static accessible-name scan
        if: ${{ !cancelled() }}
        run: npx tsx scripts/a11y-names-scan.ts --check

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
